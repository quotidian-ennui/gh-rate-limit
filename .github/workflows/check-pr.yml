name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@da5bf91c178d83ccfc784f0db2b4c0d62180ca77 # v2.2.6
    permissions:
      contents: write
      pull-requests: write
      checks: write
