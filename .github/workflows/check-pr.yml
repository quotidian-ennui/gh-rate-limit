name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@552a30d3dc628fa89ee8d6a71e9c2257718b90ca # v2.2.9
    permissions:
      contents: write
      pull-requests: write
      checks: write
