name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@cfbc733e68762bde7bae6a2fd901cec152f15b44 # v2.2.10
    permissions:
      contents: write
      pull-requests: write
      checks: write
