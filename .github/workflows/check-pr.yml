name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@c320b9338c82c82ab6edaf6feb89e0a8ed3fa22e # v2.2.12
    permissions:
      contents: write
      pull-requests: write
      checks: write
