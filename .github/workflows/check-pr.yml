name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@5fe3301a3906df8e2310b10c9eb814a72ab670f2 # v2.2.11
    permissions:
      contents: write
      pull-requests: write
      checks: write
