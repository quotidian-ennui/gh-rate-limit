name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@41b239dfe055a266ef7aedf204c2fc997f247a35 # v2.2.7
    permissions:
      contents: write
      pull-requests: write
      checks: write
