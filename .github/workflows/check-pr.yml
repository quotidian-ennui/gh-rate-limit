name: Check PR
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  check-pr:
    uses: quotidian-ennui/workflows-olio/.github/workflows/check-pr-with-trigger.yml@31b0c5330537ddcec7a0ad536bb2c960ecb63e72 # v2.2.8
    permissions:
      contents: write
      pull-requests: write
      checks: write
